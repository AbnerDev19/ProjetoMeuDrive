<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF • MeuDrive</title><style>
*{box-sizing:border-box}body{margin:0;background:#eaf1ff;color:#0b1c30;font:14px system-ui,sans-serif}header{position:sticky;top:0;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;padding:8px;background:#fff;border-bottom:1px solid #dce9ff;z-index:2}button,a,input{font:inherit;min-height:40px;border:1px solid #c3c6d7;border-radius:8px;background:#fff;padding:8px 12px;color:#004ac6}button:disabled{opacity:.4}a{text-decoration:none}main{padding:12px;text-align:center;overflow:auto;min-height:60vh}canvas{background:white;box-shadow:0 2px 12px #21314520;max-width:none}#status{padding:18px;line-height:1.6;overflow-wrap:anywhere}#password-form{padding:16px;text-align:center}[hidden]{display:none!important}#count{font-variant-numeric:tabular-nums;min-width:85px;text-align:center}button:focus-visible,a:focus-visible{outline:3px solid #39b8fd} @media(max-width:380px){header{gap:4px}button,a{padding:7px 9px}#count{min-width:64px}}
</style></head><body><header><button id="previous" disabled aria-label="Página anterior">←</button><span id="count" aria-live="polite">— / —</span><button id="next" disabled aria-label="Próxima página">→</button><button id="less" aria-label="Diminuir zoom">−</button><button id="more" aria-label="Aumentar zoom">+</button><a id="download">Baixar</a></header><form id="password-form" hidden><label>Senha deste PDF <input id="password" type="password" autocomplete="off" required></label><button>Abrir PDF</button></form><div id="status" role="status">Abrindo PDF…</div><main id="viewport"><canvas id="page" hidden aria-label="Página do PDF"></canvas></main><script type="module">
import * as pdfjs from '/pdfjs/pdf.min.mjs?v=6.5.438';
pdfjs.GlobalWorkerOptions.workerSrc='/pdfjs/pdf.worker.min.mjs?v=6.5.438';
const $=id=>document.getElementById(id),path=new URLSearchParams(location.search).get('path');let doc=null,page=1,zoom=1,task=null,renderId=0,pending=null;
function problem(error){$('status').hidden=false;$('status').textContent='Não foi possível abrir este PDF. Ele pode estar protegido, danificado ou a conexão foi interrompida. Você pode baixar o original. '+(error?.name==='PasswordException'?'Confira a senha do PDF.':'');$('page').hidden=true}
async function render(){if(!doc)return;const id=++renderId;if(task){task.cancel();try{await task.promise}catch(e){}}try{const pdfPage=await doc.getPage(page);if(id!==renderId)return;const initial=pdfPage.getViewport({scale:1}),width=Math.max(220,Math.min(1400,$('viewport').clientWidth-24))*zoom,scale=width/initial.width,viewport=pdfPage.getViewport({scale}),ratio=Math.min(devicePixelRatio||1,2,Math.sqrt(5000000/(viewport.width*viewport.height)));const canvas=$('page');canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';canvas.hidden=false;task=pdfPage.render({canvasContext:canvas.getContext('2d'),viewport,transform:ratio!==1?[ratio,0,0,ratio,0,0]:null});await task.promise;if(id!==renderId)return;task=null;$('status').hidden=true;$('count').textContent=page+' / '+doc.numPages;$('previous').disabled=page<=1;$('next').disabled=page>=doc.numPages;pdfPage.cleanup()}catch(e){if(e.name!=='RenderingCancelledException')problem(e)}}
$('previous').onclick=()=>{if(page>1){page--;render()}};$('next').onclick=()=>{if(doc&&page<doc.numPages){page++;render()}};$('less').onclick=()=>{zoom=Math.max(.5,zoom-.25);render()};$('more').onclick=()=>{zoom=Math.min(2,zoom+.25);render()};let resize;addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(render,200)});addEventListener('pagehide',()=>{renderId++;task?.cancel();pending?.destroy()?.catch(()=>{})});
if(!path){problem();$('download').hidden=true}else{$('download').href='/api/download?path='+encodeURIComponent(path);try{pending=pdfjs.getDocument({url:'/api/open?path='+encodeURIComponent(path),withCredentials:true,isEvalSupported:false,cMapUrl:'/pdfjs/cmaps/',cMapPacked:true,standardFontDataUrl:'/pdfjs/standard_fonts/',wasmUrl:'/pdfjs/wasm/',rangeChunkSize:262144,disableAutoFetch:true,disableStream:true});pending.onPassword=(update,reason)=>{$('password-form').hidden=false;$('status').textContent=reason===pdfjs.PasswordResponses.INCORRECT_PASSWORD?'Senha incorreta. Digite a senha deste PDF.':'Este PDF tem senha. Digite a senha do documento.';$('password-form').onsubmit=e=>{e.preventDefault();update($('password').value);$('password').value='';$('password-form').hidden=true}};doc=await pending.promise;await render()}catch(e){problem(e)}}
</script></body></html>
